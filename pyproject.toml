[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "granad"
version = "0.0.1"
authors = [
  { name="David Dams", email="david.dams@kit.edu" },
]
description = "granad"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "jax",
    "diffrax",
    "matplotlib",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest"]
docs = [
    "mkdocs",
    "pymdown-extensions",
    "mkdocstrings[python]",
    "jupytext",
    "nbconvert",
    "ipykernel",
]
